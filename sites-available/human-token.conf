# $HUMAN Token Website - nginx server configuration
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    
    # Redirect HTTP to HTTPS (uncomment when you have SSL)
    # return 301 https://$server_name$request_uri;

    # For development/testing without SSL, use this configuration:
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req zone=general burst=50 nodelay;

    # Static files (Next.js _next directory)
    location /_next/static/ {
        alias /var/www/human-token-website/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public assets
    location /images/ {
        alias /var/www/human-token-website/public/images/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /videos/ {
        alias /var/www/human-token-website/public/videos/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Favicon and robots.txt
    location = /favicon.ico {
        alias /var/www/human-token-website/public/favicon.ico;
        expires 30d;
        access_log off;
    }

    location = /robots.txt {
        alias /var/www/human-token-website/public/robots.txt;
        expires 7d;
        access_log off;
    }

    # Main application - proxy to Next.js
    location / {
        # Rate limiting for main app
        limit_req zone=api burst=20 nodelay;

        # Proxy settings
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|log|config)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

