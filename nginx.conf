# nginx configuration for Windows - $HUMAN Token Website
# Path: C:\Users\Administrator\nginx-1.29.0\conf\nginx.conf
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log logs/access.log;
    error_log logs/error.log;

    # Basic Settings
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    # $HUMAN Token Website Server
    server {
        listen       80;
        server_name  localhost your-domain.com;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Rate limiting
        limit_req zone=general burst=50 nodelay;

        # Static files from Next.js build
        location /_next/static/ {
            alias C:/Users/Administrator/nginx-1.29.0/html/human-token-website/.next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Public assets
        location /images/ {
            alias C:/Users/Administrator/nginx-1.29.0/html/human-token-website/public/images/;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        location /videos/ {
            alias C:/Users/Administrator/nginx-1.29.0/html/human-token-website/public/videos/;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }

        # Favicon
        location = /favicon.ico {
            alias C:/Users/Administrator/nginx-1.29.0/html/human-token-website/public/favicon.ico;
            expires 30d;
            access_log off;
        }

        # Main application - proxy to Next.js
        location / {
            # Rate limiting for main app
            limit_req zone=api burst=20 nodelay;

            # Proxy to Next.js running on port 3000
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check
        location /health {
            proxy_pass http://127.0.0.1:3000/health;
            access_log off;
        }

        # Block sensitive files
        location ~ /\. {
            deny all;
            access_log off;
        }

        location ~ \.(env|log|config)$ {
            deny all;
            access_log off;
        }

        # Error pages
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
